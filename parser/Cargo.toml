[package]
name = "sms-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
quick-xml = "0.37"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
